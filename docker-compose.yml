version: "3.9"

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: premolux
      POSTGRES_PASSWORD: premolux
      POSTGRES_DB: premolux
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U premolux"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+asyncpg://premolux:premolux@db:5432/premolux
    volumes:
      - ./sessions:/app/sessions
    ports:
      - "8000:8000"

volumes:
  pg_data:
